name: Tests and skill validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate skill package
        run: python scripts/validate_skill.py
      - name: Validate isolated installations without network access
        run: python scripts/smoke_install.py
      - name: Run CSV-only versus log ablation
        run: python scripts/evaluate.py
      - name: Verify checked-in synthetic demo reports
        run: |
          python scripts/render_demos.py --out "$RUNNER_TEMP/jira-demo-reports"
          diff -ru examples/reports "$RUNNER_TEMP/jira-demo-reports"
